<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0a; overflow: hidden; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  #overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; display: flex; align-items: flex-end; justify-content: center;
    padding-bottom: 2rem;
  }
  #caption {
    color: #e0e0e0; font-size: 1rem; font-weight: 500;
    text-align: center; padding: 0.75rem 1.5rem;
    background: rgba(10, 10, 10, 0.8); border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.08);
    opacity: 0; transition: opacity 0.4s;
    max-width: 85%;
  }
  #caption.visible { opacity: 1; }
</style>
</head>
<body>
<div id="overlay"><div id="caption"></div></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>

<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0a);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 1.5, 8);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.4));
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(5, 8, 5);
scene.add(dirLight);

// Prompt block
const promptMat = new THREE.MeshStandardMaterial({ color: 0x3b82f6 });
const promptMesh = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.6, 0.6), promptMat);
promptMesh.position.set(-6, 0, 0);
scene.add(promptMesh);

// Tokens
const tokenColors = [0xf59e0b, 0xef4444, 0x10b981, 0x8b5cf6, 0xec4899];
const tokens = tokenColors.map(c => {
  const m = new THREE.Mesh(
    new THREE.SphereGeometry(0.25, 16, 16),
    new THREE.MeshStandardMaterial({ color: c })
  );
  m.position.set(-6, 0, 0);
  m.scale.set(0, 0, 0);
  scene.add(m);
  return m;
});

// Neural net nodes
const nnNodes = [];
for (let r = 0; r < 3; r++) {
  for (let c = 0; c < 4; c++) {
    const m = new THREE.Mesh(
      new THREE.SphereGeometry(0.18, 12, 12),
      new THREE.MeshStandardMaterial({ color: 0x6366f1, emissive: 0x6366f1, emissiveIntensity: 0 })
    );
    m.position.set(-1 + c * 0.7, -0.8 + r * 0.8, 0);
    m.scale.set(0, 0, 0);
    scene.add(m);
    nnNodes.push(m);
  }
}

// Output block
const outputMat = new THREE.MeshStandardMaterial({ color: 0x10b981 });
const outputMesh = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.6, 0.6), outputMat);
outputMesh.position.set(6, 0, 0);
outputMesh.scale.set(0, 0, 0);
scene.add(outputMesh);

// Caption
const caption = document.getElementById('caption');
function showCaption(text) { caption.textContent = text; caption.classList.add('visible'); }
function hideCaption() { caption.classList.remove('visible'); }

// Timeline
const tl = gsap.timeline({ paused: true });

// Ch 1: Prompt slides in
tl.to(promptMesh.position, { x: -3, duration: 2, ease: "power2.out" }, 0);
tl.call(() => showCaption("You type a prompt — a question or instruction."), [], 0.5);
tl.to(promptMesh.rotation, { y: Math.PI * 0.05, duration: 3, yoyo: true, repeat: 1 }, 2);
tl.call(() => hideCaption(), [], 8);

// Ch 2: Prompt -> tokens
tl.call(() => showCaption("Your text is split into tokens — small pieces the model can read."), [], 10);
tl.to(promptMesh.scale, { x: 0, y: 0, z: 0, duration: 1 }, 11);
tokens.forEach((t, i) => {
  tl.to(t.position, { x: -2 + i * 0.7, y: 0, z: 0, duration: 0.01 }, 11);
  tl.to(t.scale, { x: 1, y: 1, z: 1, duration: 0.6, ease: "back.out(2)" }, 11.5 + i * 0.2);
});
tl.call(() => hideCaption(), [], 18);

// Ch 3: Tokens into neural net
tl.call(() => showCaption("The model predicts the most likely next tokens, one at a time."), [], 20);
nnNodes.forEach((n, i) => {
  tl.to(n.scale, { x: 1, y: 1, z: 1, duration: 0.4, ease: "back.out(2)" }, 20 + i * 0.15);
});
tokens.forEach((t, i) => {
  tl.to(t.position, { x: -0.3 + (i % 4) * 0.7, y: -0.8 + Math.floor(i / 4) * 0.8, duration: 1 }, 22 + i * 0.3);
  tl.to(t.scale, { x: 0, y: 0, z: 0, duration: 0.5 }, 23 + i * 0.3);
});
nnNodes.forEach((n, i) => {
  tl.to(n.material, { emissiveIntensity: 0.6, duration: 0.3, yoyo: true, repeat: 1 }, 24 + i * 0.1);
});
tl.call(() => hideCaption(), [], 30);

// Ch 4: Output assembles
tl.call(() => showCaption("New tokens are generated and assembled into readable text."), [], 32);
tl.to(outputMesh.scale, { x: 1, y: 1, z: 1, duration: 1, ease: "back.out(1.5)" }, 33);
tl.to(outputMesh.position, { x: 3, duration: 2, ease: "power2.out" }, 34);
nnNodes.forEach((n, i) => {
  tl.to(n.scale, { x: 0, y: 0, z: 0, duration: 0.5 }, 34 + i * 0.08);
});
tl.call(() => hideCaption(), [], 39);

// Ch 5: Takeaway
tl.call(() => showCaption("It does not think or search. It predicts plausible text — powerfully, but imperfectly."), [], 41);
tl.to(outputMesh.rotation, { y: Math.PI * 2, duration: 4, ease: "power1.inOut" }, 42);
tl.to(camera.position, { z: 6, y: 1, duration: 3, ease: "power2.inOut" }, 42);
tl.call(() => hideCaption(), [], 50);

tl.totalDuration(52);

// Playback sync
window.addEventListener("message", (e) => {
  const { type, time } = e.data || {};
  if (type === "seek") tl.seek((time / 105) * tl.totalDuration());
  if (type === "play") tl.play();
  if (type === "pause") tl.pause();
});

function animate() { requestAnimationFrame(animate); renderer.render(scene, camera); }
animate();

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
